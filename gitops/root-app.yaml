# App-of-apps: one ArgoCD Application that manages the per-environment apps.
# Apply this single file to a cluster and ArgoCD takes it from there.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: orders-api-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/saiannotations/gitops-microservice-delivery.git
    targetRevision: main
    path: gitops/apps
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
