# Development: cheap, fast feedback. Ingress off; use port-forward.
environment: dev
replicaCount: 1

image:
  tag: "latest"

ingress:
  enabled: false

autoscaling:
  enabled: false

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi

podDisruptionBudget:
  enabled: false

env:
  LOG_LEVEL: debug
