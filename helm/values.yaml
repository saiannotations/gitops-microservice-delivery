# Default values for orders-api.
# Environment-specific files (values-dev/staging/prod.yaml) override these.
environment: dev  # default; overridden by values-dev/staging/prod.yaml
replicaCount: 2

image:
  repository: ghcr.io/saiannotations/orders-api
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

ingress:
  enabled: false
  className: nginx
  host: orders.example.com
  annotations: {}

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

# CPU/memory requests and limits. Requests tell the scheduler how much room
# to reserve; limits stop one misbehaving pod from starving its neighbors.
# Environments override these in their own values files.
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

podDisruptionBudget:
  enabled: true
  minAvailable: 1

env: {}
