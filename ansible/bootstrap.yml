---
# Bootstraps a fresh Kubernetes cluster for the orders platform:
# namespaces, ArgoCD, and the monitoring stack.
#
# Usage:
#   ansible-playbook -i ansible/inventory.ini ansible/bootstrap.yml
#
# NOTE: this first version does not install metrics-server. The HPA in the
# Helm chart needs CPU metrics to work, so autoscaling silently does nothing
# until metrics-server exists -- tracked as a repo issue.
- name: Bootstrap cluster for orders platform
  hosts: cluster
  gather_facts: false

  vars:
    argocd_version: "v2.12.0"
    kube_prometheus_stack_version: "62.0.0"

  tasks:
    - name: Create application namespaces
      kubernetes.core.k8s:
        api_version: v1
        kind: Namespace
        name: "{{ item }}"
        state: present
      loop:
        - orders-dev
        - orders-staging
        - orders-prod
        - argocd
        - monitoring

    - name: Install ArgoCD
      kubernetes.core.k8s:
        state: present
        src: "https://raw.githubusercontent.com/argoproj/argo-cd/{{ argocd_version }}/manifests/install.yaml"
        namespace: argocd

    - name: Wait for ArgoCD server to be ready
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        name: argocd-server
        namespace: argocd
        wait: true
        wait_timeout: 300

    - name: Install metrics-server (required for HPA CPU metrics)
      kubernetes.core.k8s:
        state: present
        src: https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml

    - name: Add prometheus-community Helm repo
      kubernetes.core.helm_repository:
        name: prometheus-community
        repo_url: https://prometheus-community.github.io/helm-charts

    - name: Install kube-prometheus-stack
      kubernetes.core.helm:
        name: monitoring
        chart_ref: prometheus-community/kube-prometheus-stack
        chart_version: "{{ kube_prometheus_stack_version }}"
        release_namespace: monitoring
        create_namespace: true
        values:
          grafana:
            sidecar:
              dashboards:
                enabled: true
                label: grafana_dashboard
                labelValue: "1"

    - name: Apply the app-of-apps root Application
      kubernetes.core.k8s:
        state: present
        src: ../gitops/root-app.yaml
        namespace: argocd
